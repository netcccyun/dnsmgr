{extend name="common/layout" /}
{block name="title"}AxisNow 标签管理{/block}
{block name="main"}
<link href="/static/css/axisnow.css?v=4" rel="stylesheet">
<div class="row axisnow-page">
  <div class="col-xs-12 center-block" style="float:none;">
    <div class="panel panel-default panel-intro">
      <div class="panel-body">
        <form class="form-inline" id="searchToolbar" onsubmit="return reloadTable()">
          <div class="form-group"><label>搜索</label> <input class="form-control" id="keyword" placeholder="标签、说明或平台账户"></div>
          <div class="form-group"><select class="form-control" id="accountFilter"><option value="0">全部平台账户</option>{foreach $accounts as $account}<option value="{$account.id}">{$account.name}</option>{/foreach}</select></div>
          <button class="btn btn-primary" type="submit"><i class="fa fa-search"></i> 搜索</button>
          <button class="btn btn-default" type="button" onclick="clearSearch()"><i class="fa fa-refresh"></i> 刷新</button>
          <button class="btn btn-success" type="button" onclick="openCreateTag()"><i class="fa fa-plus"></i> 添加</button>
        </form>
        <table id="listTable"></table>
      </div>
    </div>
  </div>
</div>

<div class="modal fade axisnow-page" id="tagModal" tabindex="-1" role="dialog" data-backdrop="static">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><button type="button" class="close" data-dismiss="modal"><span>&times;</span></button><h4 class="modal-title" id="tagModalTitle">新增标签</h4></div>
    <div class="modal-body"><form id="tagForm">
      <input type="hidden" name="uuid" value="">
      <div class="form-group"><label>平台账户</label><select class="form-control" name="account_id" required>{foreach $accounts as $account}<option value="{$account.id}">{$account.name}</option>{/foreach}</select></div>
      <div class="form-group"><label>标签名称</label><input class="form-control" name="name" maxlength="50" required></div>
      <div class="form-group"><label>说明</label><textarea class="form-control" name="description" maxlength="255" rows="3" placeholder="可选"></textarea></div>
    </form></div>
    <div class="modal-footer"><button type="button" class="btn btn-default" data-dismiss="modal">取消</button><button type="button" class="btn btn-primary" id="saveTagButton" onclick="saveTag()">确认</button></div>
  </div></div>
</div>
{/block}
{block name="script"}
<script src="/static/js/layer/layer.js"></script>
<script src="/static/js/bootstrap-table-1.21.4.min.js"></script>
<script src="/static/js/bootstrap-table-page-jump-to-1.21.4.min.js"></script>
<script src="/static/js/custom.js?v=1006"></script>
<script>
var axisnowAccounts={$accounts|json_encode|raw};
{literal}
$(function(){
 $('#listTable').bootstrapTable({url:'/axisnow/tags/data',method:'post',pagination:true,sidePagination:'server',pageSize:getStoredPageSize('axisnow_tags_pagesize'),classes:'table table-striped table-hover table-bordered',
 queryParams:function(p){p.kw=$('#keyword').val();p.account_id=$('#accountFilter').val();return p;},responseHandler:axisnowResponse,
 columns:[
  {field:'name',title:'名称',sortable:true,formatter:function(v,row){return '<strong>'+escapeHtml(v)+'</strong><div class="axisnow-summary">关联 '+Number(row.bound_count||0)+' 个 EIP</div>'; }},
  {field:'account_name',title:'平台账户',sortable:true,formatter:function(v){return escapeHtml(v||'-');}},
  {field:'bound_count',title:'已绑定',sortable:true},
  {field:'referenced_count',title:'被规则引用',sortable:true},
  {field:'description',title:'说明',formatter:function(v){return escapeHtml(v||'-');}},
  {field:'updated_at',title:'更新时间',formatter:timeFormatter},
  {field:'action',title:'操作',formatter:function(v,row){return '<button class="btn btn-info btn-xs" onclick="openEditTag(\''+row.account_id+'\',\''+row.uuid+'\')">编辑</button> <button class="btn btn-danger btn-xs" onclick="deleteTag(\''+row.account_id+'\',\''+row.uuid+'\',\''+escapeJs(row.name)+'\')">删除</button>';}}
 ],onPageChange:function(n,s){setStoredPageSize('axisnow_tags_pagesize',s);}});
});
function axisnowResponse(res){if(res.code!==0){layer.msg(res.msg||'加载失败');return {total:0,rows:[]};}return res;}
function reloadTable(){$('#listTable').bootstrapTable('refresh',{pageNumber:1});return false;}
function clearSearch(){$('#keyword').val('');$('#accountFilter').val('0');reloadTable();}
function openCreateTag(){if(!axisnowAccounts.length){layer.alert('请先添加 AxisNow 域名账户',{icon:0});return;}document.getElementById('tagForm').reset();$('[name=uuid]').val('');$('[name=account_id]').prop('disabled',false);$('#tagModalTitle').text('新增标签');$('#tagModal').modal('show');}
function openEditTag(accountId,uuid){var ii=layer.load(2);$.getJSON('/axisnow/tags/edit',{account_id:accountId,uuid:uuid},function(res){layer.close(ii);if(res.code!==0){layer.alert(res.msg,{icon:2});return;}var row=res.data;document.getElementById('tagForm').reset();$('[name=uuid]').val(uuid);$('[name=account_id]').val(accountId).prop('disabled',true);$('[name=name]').val(row.name||'');$('[name=description]').val(row.description||'');$('#tagModalTitle').text('编辑标签');$('#tagModal').modal('show');}).fail(function(){layer.close(ii);layer.msg('服务器错误');});}
function saveTag(){var data=$('#tagForm').serializeArray();if($('[name=account_id]').prop('disabled'))data.push({name:'account_id',value:$('[name=account_id]').val()});var $btn=$('#saveTagButton').prop('disabled',true).html('<i class="fa fa-spinner fa-spin"></i> 保存中');$.post('/axisnow/tags/save',$.param(data),function(res){if(res.code===0){$('#tagModal').modal('hide');layer.msg(res.msg,{icon:1});reloadTable();}else layer.alert(res.msg||'保存失败',{icon:2});},'json').fail(function(){layer.msg('服务器错误');}).always(function(){$btn.prop('disabled',false).text('确认');});}
function deleteTag(accountId,uuid,name){layer.confirm('确定删除标签“'+name+'”吗？被引用的标签可能无法删除。',{icon:0},function(index){var ii=layer.load(2);$.post('/axisnow/tags/delete',{account_id:accountId,uuid:uuid},function(res){layer.close(ii);if(res.code===0){layer.close(index);layer.msg(res.msg,{icon:1});reloadTable();}else layer.alert(res.msg,{icon:2});},'json');});}
function timeFormatter(v){return v?escapeHtml(String(v).replace('T',' ').replace('Z','')):'-';}
function escapeHtml(v){return $('<div>').text(v==null?'':String(v)).html();}
function escapeJs(v){return String(v||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
{/literal}
</script>
{/block}
