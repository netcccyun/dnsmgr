{extend name="common/layout" /}
{block name="title"}AxisNow EIP管理{/block}
{block name="main"}
<link href="/static/css/axisnow.css?v=4" rel="stylesheet">
<div class="row axisnow-page">
  <div class="col-xs-12 center-block" style="float:none;">
    <div class="panel panel-default panel-intro">
      <div class="panel-body">
        <form class="form-inline" id="searchToolbar" onsubmit="return reloadTable()">
          <div class="form-group"><label>搜索</label> <input class="form-control" id="keyword" placeholder="EIP、标签、提供商或平台账户"></div>
          <div class="form-group"><select class="form-control" id="accountFilter"><option value="0">全部平台账户</option>{foreach $accounts as $account}<option value="{$account.id}">{$account.name}</option>{/foreach}</select></div>
          <button class="btn btn-primary" type="submit"><i class="fa fa-search"></i> 搜索</button>
          <button class="btn btn-default" type="button" onclick="clearSearch()"><i class="fa fa-refresh"></i> 刷新</button>
          <button class="btn btn-success" type="button" onclick="openCreateEip()"><i class="fa fa-plus"></i> 添加</button>
          <button class="btn btn-danger" type="button" id="batchDeleteButton" disabled onclick="batchDeleteEips()"><i class="fa fa-trash"></i> 批量删除</button>
        </form>
        <table id="listTable"></table>
      </div>
    </div>
  </div>
</div>

<div class="modal fade axisnow-page" id="eipModal" tabindex="-1" role="dialog" data-backdrop="static">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><button type="button" class="close" data-dismiss="modal"><span>&times;</span></button><h4 class="modal-title" id="eipModalTitle">新增 EIP</h4></div>
    <div class="modal-body"><form id="eipForm">
      <input type="hidden" name="uuid" value="">
      <div class="form-group"><label>平台账户</label><select class="form-control" name="account_id" required onchange="loadEipOptions()">{foreach $accounts as $account}<option value="{$account.id}">{$account.name}</option>{/foreach}</select></div>
      <div class="form-group"><label>归属类型</label><select class="form-control" name="target_type" onchange="renderTargets()"><option value="edge">边缘</option><option value="cluster">集群</option></select></div>
      <div class="form-group"><label id="targetLabel">边缘</label><select class="form-control" name="target_uuid" required></select></div>
      <div class="form-group"><label>标签</label><div class="axisnow-check-list" id="eipTagOptions"><span class="text-muted">请先选择账号</span></div><p class="help-block">直接勾选多个标签；不选择则不绑定标签。</p></div>
      <div class="form-group" id="addressesGroup"><label>EIP 地址</label><textarea class="form-control" name="addresses" rows="6" required placeholder="每行一个；支持 IP、IP 范围或 CIDR"></textarea></div>
      <div class="form-group" id="addressGroup" style="display:none;"><label>EIP 地址</label><input class="form-control" name="address"></div>
    </form></div>
    <div class="modal-footer"><button type="button" class="btn btn-default" data-dismiss="modal">取消</button><button type="button" class="btn btn-primary" id="saveEipButton" onclick="saveEip()">确认</button></div>
  </div></div>
</div>
{/block}
{block name="script"}
<script src="/static/js/layer/layer.js"></script>
<script src="/static/js/bootstrap-table-1.21.4.min.js"></script>
<script src="/static/js/bootstrap-table-page-jump-to-1.21.4.min.js"></script>
<script src="/static/js/custom.js?v=1006"></script>
<script>
var axisnowAccounts={$accounts|json_encode|raw},eipOptionCache={},currentEipOptions=null,editingEip=null;
{literal}
$(function(){
 $('#listTable').bootstrapTable({url:'/axisnow/eips/data',method:'post',pagination:true,sidePagination:'server',pageSize:getStoredPageSize('axisnow_eips_pagesize'),classes:'table table-striped table-hover table-bordered',uniqueId:'row_id',
 queryParams:function(p){p.kw=$('#keyword').val();p.account_id=$('#accountFilter').val();return p;},responseHandler:axisnowResponse,
 columns:[
  {checkbox:true,formatter:function(v,row){return {disabled:row.can_manage===false};}},
  {field:'address',title:'EIP',sortable:true,formatter:function(v,row){var geo=row.geo||{},location=[geo.country_code,geo.province_code,geo.city_name].filter(Boolean).join(' / ');return '<strong>'+escapeHtml(v)+'</strong><div class="axisnow-summary">'+escapeHtml(location||geo.isp_name||'')+'</div>'; }},
  {field:'account_name',title:'平台账户',sortable:true,formatter:function(v){return escapeHtml(v||'-');}},
  {field:'tag_names',title:'标签',formatter:function(v){if(!v||!v.length)return '-';return v.map(function(x){return '<span class="axisnow-badge axisnow-badge-dark">'+escapeHtml(x)+'</span>';}).join('');}},
  {field:'routing_referenced_count',title:'被引用',sortable:true},
  {field:'provider_name',title:'提供商',formatter:function(v){return escapeHtml(v||'-');}},
  {field:'updated_at',title:'更新时间',formatter:timeFormatter},
  {field:'action',title:'操作',formatter:function(v,row){if(row.can_manage===false)return '<span class="text-muted">订阅资源</span>';return '<button class="btn btn-info btn-xs" onclick="openEditEip(\''+row.account_id+'\',\''+row.uuid+'\')">编辑</button> <button class="btn btn-danger btn-xs" onclick="deleteOneEip(\''+row.account_id+'\',\''+row.uuid+'\',\''+escapeJs(row.address)+'\')">删除</button>';}}
 ],onPageChange:function(n,s){setStoredPageSize('axisnow_eips_pagesize',s);}});
 $('#listTable').on('check.bs.table uncheck.bs.table check-all.bs.table uncheck-all.bs.table',function(){$('#batchDeleteButton').prop('disabled',$('#listTable').bootstrapTable('getSelections').length===0);});
});
function axisnowResponse(res){if(res.code!==0){layer.msg(res.msg||'加载失败');return {total:0,rows:[]};}$.each(res.rows,function(_,r){r.row_id=r.account_id+'_'+r.uuid;});return res;}
function reloadTable(){$('#listTable').bootstrapTable('refresh',{pageNumber:1});return false;}
function clearSearch(){$('#keyword').val('');$('#accountFilter').val('0');reloadTable();}
function openCreateEip(){if(!axisnowAccounts.length){layer.alert('请先添加 AxisNow 域名账户',{icon:0});return;}editingEip=null;document.getElementById('eipForm').reset();$('[name=uuid]').val('');$('[name=account_id]').prop('disabled',false);$('#addressesGroup').show().find(':input').prop('disabled',false);$('#addressGroup').hide().find(':input').prop('disabled',true);$('#eipModalTitle').text('新增 EIP');$('#eipModal').modal('show');loadEipOptions();}
function openEditEip(accountId,uuid){var row=$('#listTable').bootstrapTable('getRowByUniqueId',accountId+'_'+uuid);if(!row||row.can_manage===false)return;editingEip=row;document.getElementById('eipForm').reset();$('[name=uuid]').val(uuid);$('[name=account_id]').val(accountId).prop('disabled',true);$('[name=target_type]').val(row.owner_type);$('#addressesGroup').hide().find(':input').prop('disabled',true);$('#addressGroup').show().find(':input').prop('disabled',false);$('[name=address]').val(row.address);$('#eipModalTitle').text('编辑 EIP');$('#eipModal').modal('show');loadEipOptions();}
function loadEipOptions(){var id=$('[name=account_id]').val();if(!id)return;if(eipOptionCache[id]){currentEipOptions=eipOptionCache[id];renderEipOptions();return;}var ii=layer.load(2);$.getJSON('/axisnow/options/'+id,{scope:'eip'},function(res){layer.close(ii);if(res.code!==0){layer.alert(res.msg,{icon:2});return;}eipOptionCache[id]=res.data;currentEipOptions=res.data;renderEipOptions();}).fail(function(){layer.close(ii);layer.msg('加载选项失败');});}
function renderEipOptions(){
  renderTargets();
  var selected=(editingEip&&editingEip.tag_uuids||[]).map(String),$tags=$('#eipTagOptions').empty(),tags=currentEipOptions.tags||[];
  if(!tags.length){$tags.append($('<span class="text-muted">').text('当前账号没有可用标签'));return;}
  $.each(tags,function(_,x){
    var id='eip-tag-'+String(x.uuid).replace(/[^a-zA-Z0-9_-]/g,''),$label=$('<label>').attr('for',id),$input=$('<input type="checkbox" name="tag_uuids[]">').attr('id',id).val(x.uuid).prop('checked',selected.indexOf(String(x.uuid))!==-1);
    $label.append($input).append(document.createTextNode(' '+(x.name||x.uuid)));$tags.append($label);
  });
}
function renderTargets(){if(!currentEipOptions)return;var type=$('[name=target_type]').val(),rows=type==='edge'?currentEipOptions.edges:currentEipOptions.clusters,$target=$('[name=target_uuid]').empty();$('#targetLabel').text(type==='edge'?'边缘':'集群');$.each(rows||[],function(_,x){$target.append($('<option>').val(x.uuid).text(x.name));});if(editingEip)$target.val(type==='edge'?editingEip.edge_uuid:editingEip.cluster_uuid);}
function saveEip(){var editing=!!$('[name=uuid]').val(),url=editing?'/axisnow/eips/update':'/axisnow/eips/create',data=$('#eipForm').serializeArray();if(editing)data.push({name:'account_id',value:$('[name=account_id]').val()});var $btn=$('#saveEipButton').prop('disabled',true).html('<i class="fa fa-spinner fa-spin"></i> 保存中');$.post(url,$.param(data),function(res){if(res.code===0){$('#eipModal').modal('hide');layer.msg(res.msg,{icon:1});reloadTable();}else layer.alert(res.msg||'保存失败',{icon:2});},'json').fail(function(){layer.msg('服务器错误');}).always(function(){$btn.prop('disabled',false).text('确认');});}
function deleteOneEip(accountId,uuid,address){layer.confirm('确定删除 EIP“'+address+'”吗？',{icon:0},function(index){deleteEipGroup(accountId,[uuid],function(){layer.close(index);reloadTable();});});}
function batchDeleteEips(){var rows=$('#listTable').bootstrapTable('getSelections').filter(function(row){return row.can_manage!==false;});if(!rows.length)return;var groups={};$.each(rows,function(_,r){(groups[r.account_id]||(groups[r.account_id]=[])).push(r.uuid);});layer.confirm('确定删除选中的 '+rows.length+' 个 EIP 吗？',{icon:0},function(index){var ids=Object.keys(groups),pos=0,ii=layer.load(2);function next(){if(pos>=ids.length){layer.close(ii);layer.close(index);layer.msg('删除完成',{icon:1});reloadTable();return;}var id=ids[pos++];$.post('/axisnow/eips/delete',{account_id:id,uuids:groups[id]},function(res){if(res.code!==0){layer.close(ii);layer.alert(res.msg,{icon:2});return;}next();},'json').fail(function(){layer.close(ii);layer.msg('服务器错误');});}next();});}
function deleteEipGroup(accountId,uuids,done){var ii=layer.load(2);$.post('/axisnow/eips/delete',{account_id:accountId,uuids:uuids},function(res){layer.close(ii);if(res.code===0){layer.msg(res.msg,{icon:1});done();}else layer.alert(res.msg,{icon:2});},'json');}
function timeFormatter(v){return v?escapeHtml(String(v).replace('T',' ').replace('Z','')):'-';}
function escapeHtml(v){return $('<div>').text(v==null?'':String(v)).html();}
function escapeJs(v){return String(v||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
{/literal}
</script>
{/block}
